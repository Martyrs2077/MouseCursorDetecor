interface:
  display_name: "Ant Design 控件来源约束"
  short_description: "从官网左侧分类选取控件并读取 LLMs.md，原生适配且保留官方排版和业务实现"
  default_prompt: "使用 $ant-design-controls 修改本项目控件，允许读取 Ant Design 总览及官方子页面所有控件的 LLMs.md；具体组件从左侧分类列表进入对应页面选取，先读取所用文档，再按官方格式排版进行 Win32 原生适配，仅调整尺寸并保持业务核心代码与逻辑不变。"
policy:
  allow_implicit_invocation: true
